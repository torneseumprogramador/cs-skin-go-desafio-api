version: '3.8'

services:
  # Banco de dados MySQL
  mysql:
    image: mysql:8.0
    container_name: cs-skin-go-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cs_skin_go
      MYSQL_USER: cs_user
      MYSQL_PASSWORD: cs_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cs-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 20s
      retries: 10

  # API NestJS
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cs-skin-go-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      API_PREFIX: api
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: cs_user
      DATABASE_PASSWORD: cs_password
      DATABASE_NAME: cs_skin_go
      JWT_SECRET: your-super-secret-jwt-key-change-in-production-32-chars
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_MAX: 100
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cs-network

volumes:
  mysql_data:

networks:
  cs-network:
    driver: bridge


